<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Splitter</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        textarea { width: 100%; height: 100px; padding: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>

    <h3>Text Splitter (Consecutive Numbers)</h3>
    <textarea id="inputText" placeholder="Paste text here... (e.g., 1. First item 2. Second item)"></textarea>
    <br><br>
    <button onclick="splitText()">Split Text</button>

    <table id="outputTable">
        <thead>
            <tr><th>Number</th><th>Text</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        function splitText() {
            let text = document.getElementById("inputText").value;
            let tbody = document.querySelector("#outputTable tbody");
            tbody.innerHTML = "";

            // Matches numbers that form a sequence (e.g. 1, 2, 3...)
            // This regex finds numbers and splits text around them while checking sequence
            let regex = /(\b\d+\b)/g;
            let parts = text.split(regex);
            
            let results = [];
            let currentNum = null;
            let currentText = "";
            let expectedNext = 1; // Change to start with the first found number if needed

            for (let i = 0; i < parts.length; i++) {
                let part = parts[i];
                if (/^\d+$/.test(part)) {
                    let num = parseInt(part, 10);
                    // Check if it's the next consecutive number
                    if (currentNum === null || num === expectedNext) {
                        if (currentNum !== null) {
                            results.push([currentNum, currentText.trim()]);
                        }
                        currentNum = num;
                        expectedNext = num + 1;
                        currentText = "";
                        continue;
                    }
                }
                currentText += part;
            }
            if (currentNum !== null) {
                results.push([currentNum, currentText.trim()]);
            }

            // Populate table
            results.forEach(row => {
                let tr = document.createElement("tr");
                tr.innerHTML = `<td>${row[0]}</td><td>${escapeHtml(row[1])}</td>`;
                tbody.appendChild(tr);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
