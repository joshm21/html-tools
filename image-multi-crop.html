<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Crop Image</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { width: 90%; margin: 3rem auto; }
        canvas { background-color: #eee; border: 1px solid black; display: none; }
        .controls { margin-top: 1rem; display: none; }
        .inline-controls { display: flex; justify-content: center; gap: 10px; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Multi-Crop Image</h2>
        <input type="file" id="imageLoader" accept="image/*">

        <canvas id="canvas"></canvas>

        <div class="controls" id="controlPanel">
            <div class="inline-controls">
                <button id="toggleMode" onclick="toggleMode()">Mode: <span id="modeText">Horizontal</span></button>
                <button onclick="detectRegions()">Detect Regions</button>
                <button onclick="exportRegions()">Export Selected Regions</button>
            </div>
        </div>

        <div id="regions-container"></div>
    </div>

    <script>
        const canvas = new fabric.Canvas('canvas');
        let image;
        let mode = 'horizontal';

        document.getElementById('imageLoader').addEventListener('change', function (event) {
            const reader = new FileReader();
            reader.onload = function (e) {
                fabric.Image.fromURL(e.target.result, function (img) {
                    canvas.clear();
                    const scaleFactor = 0.8 * window.innerHeight / img.height;
                    img.scale(scaleFactor);
                    canvas.setWidth(img.width * scaleFactor);
                    canvas.setHeight(img.height * scaleFactor);
                    img.set({ left: 0, top: 0, selectable: false });
                    canvas.add(img);
                    image = img;

                    document.getElementById('canvas').style.display = 'inline-block';
                    document.getElementById('controlPanel').style.display = 'block';
                    document.getElementById('imageLoader').style.display = 'none';
                }, { crossOrigin: 'anonymous' });
            };
            reader.readAsDataURL(event.target.files[0]);
        });

        function toggleMode() {
            mode = mode === 'horizontal' ? 'vertical' : 'horizontal';
            document.getElementById('modeText').textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
        }
    </script>
</body>
</html>
